services:
  moodle-archiving-worker:
    image: ngandrass/moodle-archiving-worker:latest
    container_name: moodle-archiving-worker
    restart: always
    ports:
      - "8080:8080"
    environment:
      - MOODLE_ARCHIVER_LOG_LEVEL=INFO
      - MOODLE_ARCHIVER_QUEUE_SIZE=8
      - MOODLE_ARCHIVER_REQUEST_TIMEOUT_SEC=1800
      - MOODLE_ARCHIVER_DOWNLOAD_MAX_FILESIZE_BYTES=512000000