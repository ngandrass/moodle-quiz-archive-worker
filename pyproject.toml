[tool.poetry]
name = "moodle-archiving-worker"
version = "4.0.4"
description = "Archiving worker service to work in conjunction with Moodle archiving plugins"
authors = ["Niels Gandraß <niels@gandrass.de>"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.11"
flask = "^3.0"
playwright = "^1.49"
requests = "^2.32"
waitress = "^3.0"
pypdf = {version = "^6.0", extras = ["image"]}

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest-timeout = "^2.3.1"
pytest = "^9.0.0"
coverage = "^7.5.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["archiveworker"]
